services:
  - type: web
    name: smart-store-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8000
      - key: CORS_ORIGINS
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: API_KEY
        generateValue: true
      - key: TRUSTED_HOSTS
        value: smart-store-backend.onrender.com,127.0.0.1,localhost
      - key: SEED_DEMO_DATA
        value: false
      - key: ENABLE_SAMPLE_VIDEO
        value: false
      - key: DEBUG
        value: false
